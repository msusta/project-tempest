name: 'IaaC Deploy'

on:
  push:
    branches:
      - dev

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  tf_version: '1.11.4'
  tg_version: '0.76.1'
  # ref_name == branch
  branch: ${{ github.ref_name }}

jobs:
  checks:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
      - name: Check terragrunt HCL
        uses: gruntwork-io/terragrunt-action@v2.1.8
        with:
          tf_version: ${{ env.tf_version }}
          tg_version: ${{ env.tg_version }}
          tg_dir: terragrunt/${{ env.branch }}
          tg_command: 'hclfmt --check --diff'

  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name }}
    permissions:
      id-token: write
      contents: read
    needs: [ checks ]
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
      - name: Assuming AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_DEPLOY }}
          role-session-name: gha-infra
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy
        uses: gruntwork-io/terragrunt-action@v2.1.8
        #env:
        #  INPUT_PRE_EXEC_1: sudo apt -qq update
        #  INPUT_PRE_EXEC_2: sudo apt install -qq -y --no-install-recommends python3
        with:
          tf_version: ${{ env.tf_version }}
          tg_version: ${{ env.tg_version }}
          tg_dir: terragrunt/${{ env.branch }}
          tg_command: 'run-all apply'
