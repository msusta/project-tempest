infra_cd_role:
  path: "/github/"
  name_prefix: "github-actions-infra-apply"
  policies: {
    admin: "arn:aws:iam::aws:policy/AdministratorAccess"
  }
  subjects:
    - msusta/project-tempest:*

infra_ci_role:
  path: "/github/"
  name_prefix: "github-actions-infra-plan"
  policies: {
    readonly: "arn:aws:iam::aws:policy/ReadOnlyAccess",
    ssm: "arn:aws:iam::aws:policy/AmazonSSMReadOnlyAccess"
  }
  subjects:
    - msusta/project-tempest:*

vpc:
  name: "tempest-dev"
  cidr: "172.31.0.0/16"
  azs: [ "eu-west-1a", "eu-west-1b" ]
  public_subnets:
    - "172.31.0.0/24"
    - "172.31.1.0/24"
  public_subnet_tags:
    "kubernetes.io/role/elb": 1
  private_subnets:
    - "172.31.8.0/24"
    - "172.31.9.0/24"
  private_subnet_tags:
    "kubernetes.io/role/internal-elb": 1
    "karpenter.sh/discovery": "tempest-dev"
  database_subnets:
    - "172.31.16.0/24"
    - "172.31.17.0/24"
  # single NAT GW for dev
  enable_nat_gateway: true
  single_nat_gateway: true
  one_nat_gateway_per_az: false

rds_subnet_group:
  name: "tempest-dev"
  use_name_prefix: true
  description: "Shared RDS subnet group for environment"

eks:
  cluster_name: "tempest-dev"
  cluster_version: "1.33"
  cluster_upgrade_policy:
    support_type: "STANDARD"
  cluster_endpoint_public_access: true
  cluster_endpoint_public_access_cidrs:
    - "185.158.64.11/32"
    - "0.0.0.0/0"
  iam_role_path: "/eks/cluster/"
  node_iam_role_path: "/eks/node/"
  node_iam_role_additional_policies:
    SSM: "arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore"
  cluster_addons:
    coredns: {
      most_recent: true
    }
    eks-pod-identity-agent: {
      most_recent: true
    }
    kube-proxy: {
      most_recent: true
    }
    eks-node-monitoring-agent: {
      most_recent: true
    }
    metrics-server: {
      most_recent: true
    }
    aws-efs-csi-driver: {
      most_recent: true
    }
    #cert-manager: {}
  cloudwatch_log_group_retention_in_days: 7
  eks_managed_node_groups:
    x86-spot-bigger:
      name: "tempest-dev-spot-big"
      capacity_type: "SPOT"
      min_size: 0
      max_size: 8
      desired_size: 4
      instance_types:
        - "t3.large"
        - "t3.xlarge"
        - "t3a.large"
        - "t3a.xlarge"
      ami_type: "BOTTLEROCKET_x86_64"
      enable_monitoring: true
      iam_role_additional_policies:
        SSM: "arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore"

wordpress_blog:
  name: "tempest-dev-blog"
  domain: "tempest.susta.name"
  # app
  # db

wordpress_blog_tls_cert:
  domain_name: "tempest.susta.name"
  #subject_alternative_names:
  validate_certificate: false
  validation_method: "DNS"
  create_route53_records: false
  wait_for_validation: false

